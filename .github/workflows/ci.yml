name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Windows 与 macOS 都执行同一套边界、前端和 Rust 检查，防止只在开发者当前平台可用。
    # 这里证明源码可构建/可测试；安装包签名和发布物验证由 windows-release.yml 负责。
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ci-${{ matrix.os }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify generated IPC bindings
        shell: pwsh
        run: |
          # Rust 是 IPC 类型的唯一来源。重新生成后必须零差异，禁止手改 TypeScript 镜像类型。
          pnpm bindings
          git diff --exit-code -- src/generated/rust-types.ts

      - name: Verify frontend
        run: |
          # 先跑 Rust-only 架构门禁，再跑普通 lint/typecheck/test/build；两类检查关注点不同。
          pnpm scan:frontend-boundaries
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Verify Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Verify Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets
