name: Code verification
run-name: Code verification · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-companion:
    name: Android Companion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: 9.6.1
          # 只让默认分支写共享缓存；PR 和手动分支只读，避免污染主线缓存。
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build, verify and stage fixed-identity Companion
        run: ./scripts/build-android-companion.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intercept-proxy-android-companion
          path: android-companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  coverage:
    name: Coverage gates
    needs: android-companion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        run: ./scripts/stage-android-companion.sh companion-artifact/app-release.apk

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: coverage-linux
          cache-on-failure: true

      - name: Install pinned coverage tools
        run: |
          deno ci
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Verify coverage policy tests
        run: deno task test:coverage-policy

      - name: Verify frontend coverage
        run: deno task check:coverage:frontend

      - name: Verify Rust coverage
        run: deno task check:coverage:rust

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: coverage
          if-no-files-found: warn

  verify:
    # 开发分支普通 push 不触发本工作流；需要提前验证时手动运行 Windows。
    # PR 只跑 Windows，main 再补 Windows + macOS；安装包签名和发布物由 windows-release.yml 负责。
    name: Verify (${{ matrix.os }})
    needs: android-companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["windows-latest","macos-14"]' || '["windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true

      - name: Restore Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('deno.lock', 'package.json', 'next.config.*', 'src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('deno.lock', 'package.json') }}-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}
          add-job-id-key: false
          cache-on-failure: true

      - name: Install frontend dependencies
        run: deno ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        shell: bash
        run: ./scripts/stage-android-companion.sh companion-artifact/app-release.apk

      - name: Audit production frontend dependencies
        run: deno audit --level high --frozen-lockfile

      - name: Verify generated IPC bindings
        shell: pwsh
        run: |
          # Rust 是 IPC 类型的唯一来源。连续生成两次都必须零差异，既防手改镜像类型，
          # 也防生成器顺序或时间戳导致同一源码产生不同结果。
          cargo build --release --manifest-path src-tauri/Cargo.toml --features export-bindings --bin export-bindings
          $generator = if ($IsWindows) {
            "src-tauri/target/release/export-bindings.exe"
          } else {
            "src-tauri/target/release/export-bindings"
          }
          & $generator
          git diff --exit-code -- src/generated/rust-types.ts
          & $generator
          git diff --exit-code -- src/generated/rust-types.ts

      - name: Verify frontend
        run: |
          # 架构聚合门禁包含文档、跨平面、runtime、Socket 与 Rust-only frontend 边界。
          deno task scan:architecture
          deno task scan:source-size
          deno task lint
          deno task typecheck
          deno task test
          deno task build
          deno task scan:bundle-branding

      - name: Verify Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Verify Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Verify Rust tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: Verify protocol-package Component sources
        run: deno task test:protocol-packages

      - name: Verify Rust tests (Windows)
        if: runner.os == 'Windows'
        run: |
          # The headless Windows runner cannot load the Tauri test executable
          # (STATUS_ENTRYPOINT_NOT_FOUND). Compile/link it, and execute every
          # platform-independent workspace test; Linux/macOS execute root tests.
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets --exclude intercept-proxy
          cargo test --manifest-path src-tauri/Cargo.toml -p intercept-proxy --all-targets --no-run

      - name: Verify independent runtime gates
        run: |
          deno task check:rust:windows
          cargo check --manifest-path test-support/emulator-proxy-gate/Cargo.toml --all-targets
          cargo test --manifest-path test-support/socket-relay-gate/Cargo.toml --all-targets
          cargo clippy --manifest-path test-support/socket-relay-gate/Cargo.toml --all-targets -- -D warnings
