name: Windows quick executable
run-name: Windows quick executable · ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: windows-quick-executable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-executable:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENSSL_STATIC: "1"
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}
          add-job-id-key: false
          cache-on-failure: true

      - run: deno ci
      - run: deno task build
      - run: >-
          cargo build --manifest-path src-tauri/Cargo.toml --release
          --features tauri/custom-protocol --bin intercept-proxy

      - name: Reject runtime OpenSSL DLL dependencies
        shell: pwsh
        run: ./scripts/verify-windows-openssl-runtime.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Intercept-Proxy-unsigned-executable-x64
          path: src-tauri/target/release/intercept-proxy.exe
          if-no-files-found: error
