name: Desktop release and cache warmup

on:
  workflow_dispatch:
  push:
    branches:
      # 开发分支上传未签名安装包，便于真机验收；v* 标签继续执行严格签名发布门禁。
      - "codex/windows-ci-cache-warmup"
      - "codex/intercept-proxy-generalization"
    tags:
      # 只有 v* 标签进入签名与签名校验；分支产物会以 unsigned 名称上传。
      - "v*"

jobs:
  android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build, verify and stage fixed-identity Companion
        run: ./scripts/build-android-companion.sh

      - name: Prepare stable Companion artifact name
        shell: bash
        run: |
          mkdir -p android-companion-artifact
          cp android-companion/app/build/outputs/apk/release/app-release.apk \
            android-companion-artifact/intercept-proxy-android-companion.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intercept-proxy-android-companion
          path: android-companion-artifact/intercept-proxy-android-companion.apk
          if-no-files-found: error

  verify:
    name: Verify before packaging (${{ matrix.os }})
    needs: android-companion
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-verify-${{ matrix.os }}
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        shell: bash
        run: >-
          ./scripts/stage-android-companion.sh
          companion-artifact/intercept-proxy-android-companion.apk

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify generated IPC bindings twice
        shell: pwsh
        run: |
          pnpm bindings
          git diff --exit-code -- src/generated/rust-types.ts
          pnpm bindings
          git diff --exit-code -- src/generated/rust-types.ts

      - name: Verify frontend and architecture boundaries
        run: |
          node scripts/check-runtime-architecture.mjs --require-zero-debt
          node scripts/check-socket-relay-boundaries.mjs
          pnpm scan:frontend-boundaries
          pnpm scan:source-size
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm scan:bundle-branding

      - name: Verify Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Verify Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Verify Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets

      - name: Verify independent runtime gates
        run: |
          cargo check --manifest-path test-support/emulator-proxy-gate/Cargo.toml --all-targets
          cargo test --manifest-path test-support/socket-relay-gate/Cargo.toml --all-targets
          cargo clippy --manifest-path test-support/socket-relay-gate/Cargo.toml --all-targets -- -D warnings

  build:
    needs: [android-companion, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Restore Rust and Tauri tool caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-release
          cache-directories: |
            ~/AppData/Local/tauri
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        shell: bash
        run: >-
          ./scripts/stage-android-companion.sh
          companion-artifact/intercept-proxy-android-companion.apk

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high

      - name: Configure Authenticode signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          # 标签发布采用 fail-closed：任一密钥/密码/时间戳地址缺失就中止，绝不降级成未签名发布。
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "Tagged releases require WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD and WINDOWS_TIMESTAMP_URL."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-code-signing.pfx"
          # GitHub Secret 中保存 Base64 PFX，只在临时 runner 上还原；导入后禁止再次导出私钥。
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password `
            -Exportable:$false
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            throw "The Windows signing PFX did not import a private-key identity."
          }
          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          if (-not ($certificate.EnhancedKeyUsageList.ObjectId.Value -contains $codeSigningOid)) {
            throw "The imported certificate is not valid for code signing."
          }

          $signingConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                tsp = $true
              }
            }
          }
          $configPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/tauri.signing.conf.json"
          $signingConfig |
            ConvertTo-Json -Depth 4 |
            Set-Content -Path $configPath -Encoding UTF8
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT

      - name: Remove stale installer outputs
        shell: pwsh
        run: |
          Remove-Item "src-tauri/target/release/bundle/msi" `
            -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "src-tauri/target/release/bundle/nsis" `
            -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build MSI and NSIS installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: >-
            --bundles msi,nsis
            ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.signing.conf.json' || '' }}

      - name: Verify Authenticode signatures before release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
        run: |
          # “构建成功”不等于“签名成功”。主程序、MSI、NSIS 都必须签名有效、签发者一致且有时间戳。
          $app = Get-Item `
            "src-tauri/target/release/intercept-proxy.exe" `
            -ErrorAction Stop
          $msi = @(
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" `
              -File -ErrorAction SilentlyContinue
          )
          $nsis = @(
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" `
              -File -ErrorAction SilentlyContinue
          )
          if ($msi.Count -lt 1) {
            throw "Expected at least one signed MSI installer."
          }
          if ($nsis.Count -lt 1) {
            throw "Expected at least one signed NSIS installer."
          }
          $artifacts = @($app.FullName)
          $artifacts += $msi | Select-Object -ExpandProperty FullName
          $artifacts += $nsis | Select-Object -ExpandProperty FullName
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $artifact`: $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT) {
              throw "Unexpected Authenticode signer for $artifact."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode timestamp is missing for $artifact."
            }
          }

      - name: Upload MSI and NSIS installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Intercept-Proxy-signed-installers-x64' || 'Intercept-Proxy-unsigned-installers-x64' }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Package portable executable
        shell: pwsh
        run: ./scripts/package-portable.ps1 -SkipBuild

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Intercept-Proxy-signed-portable-x64' || 'Intercept-Proxy-unsigned-portable-x64' }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Remove imported signing material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_THUMBPRINT: ${{ steps.windows_signing.outputs.thumbprint }}
          SIGNING_PFX_PATH: ${{ steps.windows_signing.outputs.pfx_path }}
        run: |
          # always() 保证前面任何发布步骤失败时也会清理证书、PFX 和临时 Tauri 配置。
          # 分支预热从未导入签名材料，因此该步骤只在 v* 标签运行。
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PATH)) {
            Remove-Item $env:SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }
          Remove-Item "src-tauri/tauri.signing.conf.json" -Force -ErrorAction SilentlyContinue

  build-macos:
    name: build-macos-universal
    needs: [android-companion, verify]
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install both macOS Rust targets
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Restore Rust and Tauri tool caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-universal-release
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        shell: bash
        run: >-
          ./scripts/stage-android-companion.sh
          companion-artifact/intercept-proxy-android-companion.apk

      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build universal macOS app and DMG
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        with:
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Package macOS app bundle
        shell: bash
        run: |
          mkdir -p dist
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS .app 构建产物。" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" dist/Intercept-Proxy-macos-universal-app.zip

      - name: Upload universal macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Intercept-Proxy-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            dist/Intercept-Proxy-macos-universal-app.zip
          if-no-files-found: error
