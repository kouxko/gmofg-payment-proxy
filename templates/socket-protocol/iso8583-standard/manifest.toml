# 协议包宿主 API 版本。应用只加载自己支持的版本。
api = 1

[package]
id = "iso8583-ascii-standard"
name = "ISO 8583:1987 ASCII Profile"
version = "1.0.0"

# Upstream：App -> Proxy -> Server。
[document.upstream]
schema = "document.toml"
display = "display"

# Downstream：Server -> Proxy -> App。
[document.downstream]
schema = "document.toml"
display = "display"

# `frame` 同时存在于两个方向，因此宿主严格把本包识别为 Socket 包。
# Decode/Encode 固定由 protocol.rhai 提供，Display 固定由 display.rhai 提供。
[hooks.upstream]
frame = "frame"
decode = "decode"
encode = "encode"

[hooks.downstream]
frame = "frame"
decode = "decode"
encode = "encode"
