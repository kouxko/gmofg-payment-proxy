[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nuvei-tango-json"
version = "1.0.0"
description = "Read-only Nuvei Tango JSON external Socket package for Intercept Proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets==17.0.1"]

[project.scripts]
nuvei-tango-json = "nuvei_tango_json.main:main"

[tool.setuptools]
packages = ["nuvei_tango_json"]
