name: Windows quick executable
run-name: Windows quick executable · ${{ github.ref_name }}

on:
  workflow_dispatch:
  # GitHub 只允许默认分支已注册的 workflow_dispatch；本分支仅用此一次 push 启动快速验证，构建后删除。
  push:
    branches:
      - codex/http-chunked-quick-validation-20260904

concurrency:
  group: windows-quick-executable-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: 9.6.1
          # 该 workflow 仅允许可信手动触发；写入共享 Gradle 缓存供后续快速构建复用。
          cache-read-only: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build, verify and stage fixed-identity Companion
        run: ./scripts/build-android-companion.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intercept-proxy-android-companion
          path: android-companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  build-windows-executable:
    needs: android-companion
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
          cache: true

      - name: Restore shared Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('deno.lock', 'package.json', 'next.config.*', 'src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('deno.lock', 'package.json') }}-

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}
          add-job-id-key: false
          cache-on-failure: true

      - run: deno ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intercept-proxy-android-companion
          path: companion-artifact

      - name: Stage Companion desktop resource
        shell: bash
        run: ./scripts/stage-android-companion.sh companion-artifact/app-release.apk

      - run: deno task build
      - run: >-
          cargo build --manifest-path src-tauri/Cargo.toml --release
          --features tauri/custom-protocol --bin intercept-proxy

      - name: Reject runtime OpenSSL DLL dependencies
        shell: pwsh
        run: ./scripts/verify-windows-openssl-runtime.ps1

      - name: Prepare combined quick-validation artifact
        shell: bash
        run: |
          mkdir -p quick-artifact/resources
          cp src-tauri/target/release/intercept-proxy.exe \
            quick-artifact/intercept-proxy.exe
          cp companion-artifact/app-release.apk \
            quick-artifact/resources/android-companion.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Intercept-Proxy-quick-validation-x64
          path: quick-artifact
          if-no-files-found: error
