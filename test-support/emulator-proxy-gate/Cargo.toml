[package]
name = "emulator-proxy-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
encoding_rs = "0.8.35"
intercept-proxy-application = { path = "../../src-tauri/crates/application" }
intercept-proxy-domain = { path = "../../src-tauri/crates/domain" }
intercept-proxy-host = { path = "../../src-tauri/crates/host" }
intercept-proxy-infrastructure = { path = "../../src-tauri/crates/infrastructure" }
intercept-proxy-product-api = { path = "../../src-tauri/crates/product-api" }
serde_json = "1.0.149"
tokio = { version = "1.50", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
