[package]
name = "gmofg-headless-device-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[dependencies]
gmofg-proxy-application = { path = "../../src-tauri/crates/application" }
gmofg-proxy-host = { path = "../../src-tauri/crates/host" }
gmofg-proxy-infrastructure = { path = "../../src-tauri/crates/infrastructure" }
ring = "0.17.14"
serde_json = "1.0.149"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal", "time"] }
zeroize = "1.8.2"
